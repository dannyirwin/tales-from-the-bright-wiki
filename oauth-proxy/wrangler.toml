#:schema node_modules/wrangler/config-schema.json
# Password → GitHub issue suggest form (replaces Decap OAuth).
# Keep folder name oauth-proxy so existing CF Root directory still works.

compatibility_date = "2025-11-17"
main = "src/index.ts"
name = "tales-from-the-bright-wiki-decap"

[vars]
GITHUB_REPO = "dannyirwin/tales-from-the-bright-wiki"
WIKI_ORIGIN = "https://dannyirwin.github.io"
