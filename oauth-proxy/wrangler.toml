#:schema node_modules/wrangler/config-schema.json
# Scaffold for Decap GitHub OAuth on Cloudflare Workers.
# Full steps: ../admin/README.md
# Upstream reference: https://github.com/sterlingwes/decap-proxy

compatibility_date = "2025-11-17"
main = "src/index.ts"
name = "tftb-decap-oauth"

# Repo is public → public_repo scope is enough.
[vars]
GITHUB_REPO_PRIVATE = "0"
